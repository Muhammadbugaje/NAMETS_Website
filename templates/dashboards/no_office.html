{% extends "dashboards/base_dashboard.html" %}
{% load static %}

{% block dash_content %}
<div class="no-office-container">
    <div class="no-office-icon">🏢</div>
    <h1>No Office Assigned</h1>
    <p>You don't currently hold an office.</p>
    <p class="sub-text">Contact the ICT Head if you believe this is a mistake.</p>
    <a href="{% url 'core:homepage' %}" class="btn-primary">← Back to Home</a>
</div>

<style>
.no-office-container {
    max-width: 500px;
    margin: 4rem auto;
    text-align: center;
    padding: 0 1.5rem;
}
.no-office-icon {
    font-size: 4rem;
    margin-bottom: 1rem;
}
.no-office-container h1 {
    color: var(--text-primary);
    margin: 0 0 0.25rem;
}
.no-office-container p {
    color: var(--text-muted);
}
.no-office-container .sub-text {
    color: var(--text-muted);
    font-size: 0.95rem;
    margin-bottom: 1.5rem;
}
</style>
{% endblock %}
