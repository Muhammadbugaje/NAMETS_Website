{% extends "accounts/base_accounts.html" %}
{% load static %}

{% block auth_content %}
    <h2>🔑 Reset Password</h2>
    <p class="sub">Enter your email and we'll send you a reset link.</p>

    <form method="post" id="resetForm">
        {% csrf_token %}
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" name="email" id="email" placeholder="your@email.com" required autofocus>
        </div>
        <button type="submit" class="btn-submit" id="submitBtn">
            <span class="btn-text">📧 Send Reset Link</span>
            <span class="spinner-border spinner-border-sm d-none" id="spinner"></span>
        </button>
    </form>

    <a href="{% url 'accounts:portal_entry' %}" class="back-link">← Back to Login</a>

    <script>
        document.getElementById('resetForm').addEventListener('submit', function() {
            const btn = document.getElementById('submitBtn');
            const text = btn.querySelector('.btn-text');
            const spinner = document.getElementById('spinner');
            btn.disabled = true;
            text.textContent = 'Sending...';
            spinner.classList.remove('d-none');
        });
    </script>
{% endblock %}
