{% extends "accounts/base_accounts.html" %}
{% load static %}

{% block auth_content %}
    <h2>🔑 Set Your Password</h2>
    <p class="sub">This is your first login — please create a secure password.</p>

    {% if messages %}
        <div class="messages">
            {% for message in messages %}
                <div class="{% if 'error' in message.tags %}error{% else %}success{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <form method="post" id="passwordForm">
        {% csrf_token %}
        <div class="form-group">
            <label for="id_new_password">New Password</label>
            <input type="password" name="new_password" id="id_new_password" placeholder="Create a strong password" required minlength="8">
            <div style="height: 4px; background: #e8edec; border-radius: 4px; margin-top: 4px; overflow: hidden;">
                <div id="strength-bar" style="height: 100%; width: 0%; border-radius: 4px; transition: width 0.3s, background 0.3s;"></div>
            </div>
            <div id="strength-label" style="font-size: 0.8rem; color: #8a9b95; margin-top: 2px; min-height: 1.2rem;"></div>
        </div>
        <div class="form-group">
            <label for="id_confirm_password">Confirm Password</label>
            <input type="password" name="confirm_password" id="id_confirm_password" placeholder="Re-enter your password" required>
        </div>
        <button type="submit" class="btn-submit" id="submitBtn">
            <span class="btn-text">Set Password</span>
            <span class="spinner-border spinner-border-sm d-none" id="submitSpinner"></span>
        </button>
    </form>

    <script src="{% static 'js/password_strength.js' %}"></script>

    <script>
        document.getElementById('passwordForm').addEventListener('submit', function() {
            const btn = document.getElementById('submitBtn');
            const text = btn.querySelector('.btn-text');
            const spinner = document.getElementById('submitSpinner');
            btn.disabled = true;
            text.textContent = 'Setting password...';
            spinner.classList.remove('d-none');
        });
    </script>
{% endblock %}
